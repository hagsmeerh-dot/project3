 <a href="index.html"> الصفحة الرئيسية </a>

<div class="container">

<div class="card">
    <div class="card">
        <div class="icon">📝</div>
       
        <h2>بيانات التسجيل</h2>
       
        <input id="aid" inputmode="numeric" autocomplete="off" placeholder="رقم الطالب">
<input id="apass" type="password" autocomplete="new-password" placeholder="كلمة المرور">
<input id="aname" autocomplete="name" placeholder="اسم الطالب">
<input id="agrade" placeholder="الصف">
<input id="aclass" placeholder="الشعبة">
<input id="aparent" autocomplete="name" placeholder="ولي الأمر">
<input id="aphone" inputmode="numeric" autocomplete="tel" placeholder="هاتف ولي الأمر">
<input id="apay" inputmode="numeric" placeholder="المبلغ المستحق">


<button onclick="addStudent()">إضافة الطالب</button>

</div>
